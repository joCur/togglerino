name: CI

on:
  push:
    branches:
      - main
      - 'release-please--branches--**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: togglerino
          POSTGRES_PASSWORD: togglerino
          POSTGRES_DB: togglerino
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U togglerino"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://togglerino:togglerino@localhost:5432/togglerino?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run database migrations
        run: |
          for f in migrations/*.up.sql; do
            PGPASSWORD=togglerino psql -h localhost -U togglerino -d togglerino -f "$f"
          done

      - name: Build frontend (required for go:embed)
        run: cd web && npm ci && npm run build

      - name: Run Go tests
        run: go test ./...

  test-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test JavaScript SDK
        run: cd sdks/javascript && npm ci && npm test

      - name: Test React SDK
        run: cd sdks/react && npm ci && npm test

  test-dotnet-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: cd sdks/dotnet && dotnet restore
      - name: Build
        run: cd sdks/dotnet && dotnet build --no-restore
      - name: Test
        run: cd sdks/dotnet && dotnet test --no-build --verbosity normal

  test-go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run Go SDK tests
        working-directory: sdks/go
        run: go test -v -race -timeout 60s ./...

  test-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test MCP server
        run: cd mcp && npm ci && npm test

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint frontend
        run: cd web && npm ci && npm run lint

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build docs site
        run: cd docs-site && npm ci && npm run build

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (when cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Start E2E environment
        working-directory: e2e
        run: |
          COMPOSE_PROJECT_NAME=togglerino-e2e docker compose -f docker-compose.e2e.yml up -d --build
          timeout 120 bash -c 'until curl -sf http://localhost:9091/healthz; do sleep 2; done'

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:9091
          E2E_DATABASE_URL: postgres://togglerino:togglerino@localhost:5433/togglerino?sslmode=disable

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Tear down E2E environment
        if: always()
        working-directory: e2e
        run: COMPOSE_PROJECT_NAME=togglerino-e2e docker compose -f docker-compose.e2e.yml down -v

  build:
    runs-on: ubuntu-latest
    needs: [test-go, test-sdks, test-dotnet-sdk, test-go-sdk, test-mcp, lint-frontend, build-docs, test-e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Build Go binary
        run: go build -o togglerino ./cmd/togglerino
